<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#daf2ff"/>
    </linearGradient>
    <pattern id="dotgrid" x="0" y="0" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="21" cy="21" r="1.4" fill="#8cc8e8" opacity="0.38"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dotgrid)"/>

  <!-- Soft glow ellipse behind figure (depth) -->
