    <line x1="294" y1="200" x2="298" y2="348" stroke-width="22"/>
    <!-- Left arm — raised forward/up (active rehab limb) -->
    <line x1="280" y1="233" x2="218" y2="185" stroke-width="15"/>
    <line x1="218" y1="185" x2="193" y2="160" stroke-width="13"/>
    <!-- Right arm — back for balance -->
    <line x1="310" y1="233" x2="374" y2="274" stroke-width="15"/>
    <line x1="374" y1="274" x2="398" y2="298" stroke-width="13"/>
    <!-- Left leg — stride forward -->
    <line x1="286" y1="348" x2="256" y2="456" stroke-width="19"/>
    <line x1="256" y1="456" x2="228" y2="552" stroke-width="17"/>
    <!-- Right leg — stride back -->
    <line x1="306" y1="348" x2="334" y2="450" stroke-width="19"/>
    <line x1="334" y1="450" x2="355" y2="545" stroke-width="17"/>
  </g>

